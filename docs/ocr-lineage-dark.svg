<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="451" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">How the model got here</text><text x="20" y="49" font-size="12" fill="#94928b">Each box: one version, its int8 held-out exact-line accuracy (%). Arrows: what changed.</text><rect x="20" y="62" width="12" height="12" rx="3" fill="#3987e5"/><text x="38" y="72" font-size="12" fill="#c3c2b7">on Hugging Face</text><rect x="153.0" y="62" width="12" height="12" rx="3" fill="#d95926"/><text x="171.0" y="72" font-size="12" fill="#c3c2b7">candidate, not published</text><rect x="345" y="62" width="12" height="12" rx="3" fill="#1a1a19" stroke="#94928b" stroke-dasharray="3 2"/><text x="363" y="72" font-size="12" fill="#c3c2b7">dead end</text><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#94928b"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#d95926"/></marker></defs><text x="51" y="94" font-size="11" text-anchor="middle" fill="#94928b">Oct 9</text><text x="145" y="94" font-size="11" text-anchor="middle" fill="#94928b">Oct 10</text><text x="239" y="94" font-size="11" text-anchor="middle" fill="#94928b">Oct 25</text><text x="333" y="94" font-size="11" text-anchor="middle" fill="#94928b">Oct 31</text><text x="427" y="94" font-size="11" text-anchor="middle" fill="#94928b">Nov 1</text><text x="521" y="94" font-size="11" text-anchor="middle" fill="#94928b">Nov 2</text><text x="615" y="94" font-size="11" text-anchor="middle" fill="#94928b">Nov 4-6</text><text x="709" y="94" font-size="11" text-anchor="middle" fill="#94928b">Nov 7 CPU</text><text x="803" y="94" font-size="11" text-anchor="middle" fill="#94928b">Nov 7-8 GPU</text><path d="M94,142 H100" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="98" y="113" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c3c2b7">+ data</text><path d="M188,142 H194" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="192" y="113" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c3c2b7">+ 35 epochs</text><path d="M65,165 V186 H333 V167" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="71" y="182" font-size="10.5" text-anchor="start" font-weight="400" fill="#c3c2b7">from Oct 9 weights, orkungedik data removed</text><path d="M37,165 V244 H288" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="45" y="236" font-size="10.5" text-anchor="start" font-weight="600" fill="#ffffff">new architecture: conv sequence instead of LSTM</text><path d="M376,244 H382" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="380" y="215" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c3c2b7">+ donut documents</text><path d="M470,244 H476" fill="none" stroke="#94928b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="474" y="215" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c3c2b7">longer training</text><path d="M415,267 V340 H664" fill="none" stroke="#d95926" stroke-width="2"  marker-end="url(#b)"/><text x="423" y="332" font-size="10.5" text-anchor="start" font-weight="600" fill="#ffffff">pruning: 70% of channels kept</text><path d="M752,340 H758" fill="none" stroke="#94928b" stroke-width="1.5"  marker-end="url(#a)"/><text x="756" y="311" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c3c2b7">GPU, +5 epochs</text><path d="M441,267 V296 H615 V397" fill="none" stroke="#94928b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="621" y="310" font-size="10.5" text-anchor="st