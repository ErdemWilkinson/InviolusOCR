<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 366" width="860" height="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="365" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">InviolusOCR roadmap</text><text x="20" y="49" font-size="12" fill="#7d7b75">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#e1e0d9"/><text x="20" y="130" font-size="15" font-weight="700" fill="#0b0b0b">OCR</text><rect x="122" y="116" width="233" height="105" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.6"/><rect x="122" y="116" width="4" height="105" rx="2" fill="#eb6834"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Publish Pt (171 KB) in place of</text><text x="134" y="155" font-size="12.5" font-weight="600" fill="#0b0b0b">tiny</text><rect x="130" y="166" width="217" height="53" rx="4" fill="#f1f0ec"/><text x="134" y="181" font-size="11.5" fill="#52514e">Passed: beats tiny on all three</text><text x="134" y="196" font-size="11.5" fill="#52514e">sets (paired test, p ≤ 0.016);</text><text x="134" y="211" font-size="11.5" fill="#52514e">waits for the owner's approval</text><rect x="122" y="229" width="233" height="105" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.6"/><rect x="122" y="229" width="4" height="105" rx="2" fill="#eb6834"/><text x="134" y="251" font-size="12.5" font-weight="600" fill="#0b0b0b">Publish a 298 KB model (P2 or</text><text x="134" y="268" font-size="12.5" font-weight="600" fill="#0b0b0b">P3)</text><rect x="130" y="279" width="217" height="53" rx="4" fill="#f1f0ec"/><text x="134" y="294" font-size="11.5" fill="#52514e">Passed: beats its from-scratch</text><text x="134" y="309" font-size="11.5" fill="#52514e">control; 760 ms on the ESP32-P4,</text><text x="134" y="324" font-size="11.5" fill="#52514e">under 1 s</text><rect x="365" y="116" width="233" height="88" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Quantization-aware training</text><rect x="373" y="149" width="217" height="53" rx="4" fill="#f1f0ec"/><text x="377" y="164" font-size="11.5" fill="#52514e">Blocked: TF-MOT cannot quantize</text><text x="377" y="179" font-size="11.5" fill="#52514e">BatchNorm after Conv1D; fold it</text><text x="377" y="194" font-size="11.5" fill="#52514e">or write a custom QuantizeConfig</text><rect x="365" y="212" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="377" y="234" font-size="12.5" font-weight="600" fill="#0b0b0b">Longer pruned runs (2-3 h)</text><rect x="373" y="245" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="377" y="260" font-size="11.5" fill="#52514e">Gate: still ahead of the</text><text x="377" y="275" font-size="11.5" fill="#52514e">same-budget scratch run</text><rect x="607" y="116" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Feed the GPU faster</text><rect x="615" y="149" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="164" font-size="11.5" fill="#52514e">Gate: epoch below 100 s (now</text><text x="619" y="179" font-size="11.5" fill="#52514e">155-180 s)</text><rect x="607" y="197" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="219" font-size="12.5" font-weight="600" fill="#0b0b0b">More real scene-text data</text><rect x="615" y="230" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="245" font-size="11.5" fill="#52514e">Gate: licence allows it; no</text><text x="619" y="260" font-size="11.5" fill="#52514e">orkungedik data</text></svg>