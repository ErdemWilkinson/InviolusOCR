<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 383" width="860" height="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="382" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">InviolusOCR roadmap</text><text x="20" y="49" font-size="12" fill="#7d7b75">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#7d7b75">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#e1e0d9"/><text x="20" y="130" font-size="15" font-weight="700" fill="#0b0b0b">OCR</text><rect x="122" y="116" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.6"/><rect x="122" y="116" width="4" height="73" rx="2" fill="#eb6834"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Train P and S longer on the GPU</text><rect x="130" y="149" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="134" y="164" font-size="11.5" fill="#52514e">Gate: P beats S by ≥ 2 points on</text><text x="134" y="179" font-size="11.5" fill="#52514e">TS-TR</text><rect x="365" y="116" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Prune D to tiny's size (171 KB)</text><rect x="373" y="149" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="377" y="164" font-size="11.5" fill="#52514e">Gate: held-out &gt; 64.4%, TS-TR &gt;</text><text x="377" y="179" font-size="11.5" fill="#52514e">32.6%</text><rect x="365" y="197" width="233" height="90" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="377" y="219" font-size="12.5" font-weight="600" fill="#0b0b0b">Quantization-aware training for</text><text x="377" y="236" font-size="12.5" font-weight="600" fill="#0b0b0b">the pruned model</text><rect x="373" y="247" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="377" y="262" font-size="11.5" fill="#52514e">Gate: int8 loses ≤ 2 points on</text><text x="377" y="277" font-size="11.5" fill="#52514e">every set</text><rect x="607" y="116" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#0b0b0b">Publish a 298 KB model</text><rect x="615" y="149" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="164" font-size="11.5" fill="#52514e">Gate: the gates before it, plus</text><text x="619" y="179" font-size="11.5" fill="#52514e">an ESP32-P4 measurement</text><rect x="607" y="197" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="219" font-size="12.5" font-weight="600" fill="#0b0b0b">Feed the GPU faster</text><rect x="615" y="230" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="245" font-size="11.5" fill="#52514e">Gate: epoch below 100 s (now 155</text><text x="619" y="260" font-size="11.5" fill="#52514e">s)</text><rect x="607" y="278" width="233" height="73" rx="7" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="619" y="300" font-size="12.5" font-weight="600" fill="#0b0b0b">More real scene-text data</text><rect x="615" y="311" width="217" height="38" rx="4" fill="#f1f0ec"/><text x="619" y="326" font-size="11.5" fill="#52514e">Gate: licence allows it; no</text><text x="619" y="341" font-size="11.5" fill="#52514e">orkungedik data</text></svg>