<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 383" width="860" height="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="382" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">InviolusOCR roadmap</text><text x="20" y="49" font-size="12" fill="#94928b">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#2c2c2a"/><text x="20" y="130" font-size="15" font-weight="700" fill="#ffffff">OCR</text><rect x="122" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="116" width="4" height="73" rx="2" fill="#d95926"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Train P and S longer on the GPU</text><rect x="130" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="134" y="164" font-size="11.5" fill="#c3c2b7">Gate: P beats S by ≥ 2 points on</text><text x="134" y="179" font-size="11.5" fill="#c3c2b7">TS-TR</text><rect x="365" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Prune D to tiny's size (171 KB)</text><rect x="373" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="164" font-size="11.5" fill="#c3c2b7">Gate: held-out &gt; 64.4%, TS-TR &gt;</text><text x="377" y="179" font-size="11.5" fill="#c3c2b7">32.6%</text><rect x="365" y="197" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="219" font-size="12.5" font-weight="600" fill="#ffffff">Quantization-aware training for</text><text x="377" y="236" font-size="12.5" font-weight="600" fill="#ffffff">the pruned model</text><rect x="373" y="247" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="262" font-size="11.5" fill="#c3c2b7">Gate: int8 loses ≤ 2 points on</text><text x="377" y="277" font-size="11.5" fill="#c3c2b7">every set</text><rect x="607" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Publish a 298 KB model</text><rect x="615" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="164" font-size="11.5" fill="#c3c2b7">Gate: the gates before it, plus</text><text x="619" y="179" font-size="11.5" fill="#c3c2b7">an ESP32-P4 measurement</text><rect x="607" y="197" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="219" font-size="12.5" font-weight="600" fill="#ffffff">Feed the GPU faster</text><rect x="615" y="230" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="245" font-size="11.5" fill="#c3c2b7">Gate: epoch below 100 s (now 155</text><text x="619" y="260" font-size="11.5" fill="#c3c2b7">s)</text><rect x="607" y="278" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="300" font-size="12.5" font-weight="600" fill="#ffffff">More real scene-text data</text><rect x="615" y="311" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="326" font-size="11.5" fill="#c3c2b7">Gate: licence allows it; no</text><text x="619" y="341" font-size="11.5" fill="#c3c2b7">orkungedik data</text></svg>