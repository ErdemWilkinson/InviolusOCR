<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 366" width="860" height="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="365" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">InviolusOCR roadmap</text><text x="20" y="49" font-size="12" fill="#94928b">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#2c2c2a"/><text x="20" y="130" font-size="15" font-weight="700" fill="#ffffff">OCR</text><rect x="122" y="116" width="233" height="105" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="116" width="4" height="105" rx="2" fill="#d95926"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Publish Pt (171 KB) in place of</text><text x="134" y="155" font-size="12.5" font-weight="600" fill="#ffffff">tiny</text><rect x="130" y="166" width="217" height="53" rx="4" fill="#232321"/><text x="134" y="181" font-size="11.5" fill="#c3c2b7">Passed: beats tiny on all three</text><text x="134" y="196" font-size="11.5" fill="#c3c2b7">sets (paired test, p ≤ 0.016);</text><text x="134" y="211" font-size="11.5" fill="#c3c2b7">waits for the owner's approval</text><rect x="122" y="229" width="233" height="105" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="229" width="4" height="105" rx="2" fill="#d95926"/><text x="134" y="251" font-size="12.5" font-weight="600" fill="#ffffff">Publish a 298 KB model (P2 or</text><text x="134" y="268" font-size="12.5" font-weight="600" fill="#ffffff">P3)</text><rect x="130" y="279" width="217" height="53" rx="4" fill="#232321"/><text x="134" y="294" font-size="11.5" fill="#c3c2b7">Passed: beats its from-scratch</text><text x="134" y="309" font-size="11.5" fill="#c3c2b7">control; 760 ms on the ESP32-P4,</text><text x="134" y="324" font-size="11.5" fill="#c3c2b7">under 1 s</text><rect x="365" y="116" width="233" height="88" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Quantization-aware training</text><rect x="373" y="149" width="217" height="53" rx="4" fill="#232321"/><text x="377" y="164" font-size="11.5" fill="#c3c2b7">Blocked: TF-MOT cannot quantize</text><text x="377" y="179" font-size="11.5" fill="#c3c2b7">BatchNorm after Conv1D; fold it</text><text x="377" y="194" font-size="11.5" fill="#c3c2b7">or write a custom QuantizeConfig</text><rect x="365" y="212" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="234" font-size="12.5" font-weight="600" fill="#ffffff">Longer pruned runs (2-3 h)</text><rect x="373" y="245" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="260" font-size="11.5" fill="#c3c2b7">Gate: still ahead of the</text><text x="377" y="275" font-size="11.5" fill="#c3c2b7">same-budget scratch run</text><rect x="607" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Feed the GPU faster</text><rect x="615" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="164" font-size="11.5" fill="#c3c2b7">Gate: epoch below 100 s (now</text><text x="619" y="179" font-size="11.5" fill="#c3c2b7">155-180 s)</text><rect x="607" y="197" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="219" font-size="12.5" font-weight="600" fill="#ffffff">More real scene-text data</text><rect x="615" y="230" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="245" font-size="11.5" fill="#c3c2b7">Gate: licence allows it; no</text><text x="619" y="260" font-size="11.5" fill="#c3c2b7">orkungedik data</text></svg>