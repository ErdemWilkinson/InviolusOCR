<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="451" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/><text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">How the model got here</text><text x="20" y="49" font-size="12" fill="#7d7b75">Each box: one version, its int8 held-out exact-line accuracy (%). Arrows: what changed.</text><rect x="20" y="62" width="12" height="12" rx="3" fill="#2a78d6"/><text x="38" y="72" font-size="12" fill="#52514e">on Hugging Face</text><rect x="153.0" y="62" width="12" height="12" rx="3" fill="#eb6834"/><text x="171.0" y="72" font-size="12" fill="#52514e">candidate, not published</text><rect x="345" y="62" width="12" height="12" rx="3" fill="#fcfcfb" stroke="#7d7b75" stroke-dasharray="3 2"/><text x="363" y="72" font-size="12" fill="#52514e">dead end</text><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#7d7b75"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#eb6834"/></marker></defs><text x="51" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Oct 9</text><text x="145" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Oct 10</text><text x="239" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Oct 25</text><text x="333" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Oct 31</text><text x="427" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Nov 1</text><text x="521" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Nov 2</text><text x="615" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Nov 4-6</text><text x="709" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Nov 7 CPU</text><text x="803" y="94" font-size="11" text-anchor="middle" fill="#7d7b75">Nov 7-8 GPU</text><path d="M94,142 H100" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="98" y="113" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52514e">+ data</text><path d="M188,142 H194" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="192" y="113" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52514e">+ 35 epochs</text><path d="M65,165 V186 H333 V167" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="71" y="182" font-size="10.5" text-anchor="start" font-weight="400" fill="#52514e">from Oct 9 weights, orkungedik data removed</text><path d="M37,165 V244 H288" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="45" y="236" font-size="10.5" text-anchor="start" font-weight="600" fill="#0b0b0b">new architecture: conv sequence instead of LSTM</text><path d="M376,244 H382" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="380" y="215" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52514e">+ donut documents</text><path d="M470,244 H476" fill="none" stroke="#7d7b75" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="474" y="215" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52514e">longer training</text><path d="M415,267 V340 H664" fill="none" stroke="#eb6834" stroke-width="2"  marker-end="url(#b)"/><text x="423" y="332" font-size="10.5" text-anchor="start" font-weight="600" fill="#0b0b0b">pruning: 70% of channels kept</text><path d="M752,340 H758" fill="none" stroke="#7d7b75" stroke-width="1.5"  marker-end="url(#a)"/><text x="756" y="311" font-size="10.5" text-anchor="middle" font-weight="400" fill="#52514e">GPU, +5 epochs</text><path d="M441,267 V296 H615 V397" fill="none" stroke="#7d7b75" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="621" y="310" font-size="10.5" text-anchor="start" font-weight="400" fill="#52514e">D as teacher</text><text x="472" y="426" font-size="10.5" text-anchor="end" font-weight="400" fill="#52514e">half width, from scratch →</text><path d="M803,363 V397" fill="none" stroke="#eb6834" stroke-width="2"  marker-end="url(#b)"/><text x="797" y="385" font-size="10.5" text-anchor="end" font-weight="600" fill="#0b0b0b">pruned to 50%</text><g><title>Oct 9 · LSTM · 665 KB · held-out int8 32.9%</title><rect x="8" y="119" width="86" height="46" rx="6" fill="#fcfcfb" stroke="#7d7b75" stroke-width="1.5" /><text x="16" y="137" font-size="12.5" font-weight="600" fill="#0b0b0b">Oct 9</text><text x="86" y="137" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">32.9</text><text x="16" y="155" font-size="10" fill="#52514e">LSTM · 665 KB</text></g><g><title>Oct 10 · LSTM · 665 KB · held-out int8 39.5%</title><rect x="102" y="119" width="86" height="46" rx="6" fill="#fcfcfb" stroke="#7d7b75" stroke-width="1.5" /><text x="110" y="137" font-size="12.5" font-weight="600" fill="#0b0b0b">Oct 10</text><text x="180" y="137" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">39.5</text><text x="110" y="155" font-size="10" fill="#52514e">LSTM · 665 KB</text></g><g><title>Oct 25 · LSTM · 665 KB · held-out int8 32.1%</title><rect x="196" y="119" width="86" height="46" rx="6" fill="#fcfcfb" stroke="#7d7b75" stroke-width="1.5" /><text x="204" y="137" font-size="12.5" font-weight="600" fill="#0b0b0b">Oct 25</text><text x="274" y="137" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">32.1</text><text x="204" y="155" font-size="10" fill="#52514e">LSTM · 665 KB</text></g><g><title>A · LSTM · 665 KB · held-out int8 48.2%</title><rect x="290" y="119" width="86" height="46" rx="6" fill="#fcfcfb" stroke="#7d7b75" stroke-width="1.5" /><text x="298" y="137" font-size="12.5" font-weight="600" fill="#0b0b0b">A</text><text x="368" y="137" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">48.2<